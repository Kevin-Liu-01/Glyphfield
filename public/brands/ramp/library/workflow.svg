<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ramp approval workflow</title>
  <desc id="desc">The Ramp approval builder on a dotted canvas: a bill enters, a policy condition splits it, the manager has approved, and the finance step is live with a lime Approve action before payment is scheduled.</desc>
