<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="720" viewBox="0 0 2400 720" role="img" aria-labelledby="title description">
  <title id="title">Gradient light field</title>
  <desc id="description">A restrained grayscale light field with fine dither on black.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#050505"/>
      <stop offset=".34" stop-color="#111"/>
      <stop offset=".66" stop-color="#777"/>
      <stop offset=".86" stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".58"/></linearGradient>
    <pattern id="dither" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".75" fill="#fff" fill-opacity=".12"/></pattern>
  </defs>
  <rect width="2400" height="720" fill="#050505"/>
  <rect x="920" y="96" width="1260" height="528" rx="12" fill="url(#field)"/>
  <rect x="920" y="96" width="1260" height="528" rx="12" fill="url(#shade)"/>
  <rect x="920" y="96" width="1260" height="528" rx="12" fill="url(#dither)"/>
</svg>
