<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="640" viewBox="0 0 2400 640" role="img" aria-labelledby="title description">
  <title id="title">Dithered light field</title>
  <desc id="description">A broad, soft white signal fades into black through fine dither.</desc>
  <defs>
    <radialGradient id="light" cx="50%" cy="50%" r="60%"><stop stop-color="#fff"/><stop offset=".24" stop-color="#ddd"/><stop offset=".58" stop-color="#555"/><stop offset="1" stop-color="#050505"/></radialGradient>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#000" fill-opacity=".18"/></pattern>
  </defs>
  <rect width="2400" height="640" fill="url(#light)"/>
  <rect width="2400" height="640" fill="url(#dither)"/>
</svg>
