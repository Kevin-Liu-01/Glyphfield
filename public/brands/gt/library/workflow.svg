<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Source alignment</title>
  <desc id="description">Three quiet monochrome planes share one exact edge.</desc>
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#151515"/><stop offset=".7" stop-color="#555"/><stop offset="1" stop-color="#eee"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#050505"/>
  <rect x="180" y="164" width="1040" height="150" rx="6" fill="url(#light)"/>
  <rect x="180" y="375" width="1160" height="150" rx="6" fill="url(#light)" opacity=".76"/>
  <rect x="180" y="586" width="1280" height="150" rx="6" fill="url(#light)" opacity=".52"/>
</svg>
