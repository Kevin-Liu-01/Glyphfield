  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#e9e9e9"/><stop offset="1" stop-color="#bbb"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#f4f4f4"/>
  <rect x="210" y="130" width="1180" height="640" rx="10" fill="url(#surface)" stroke="#111" stroke-opacity=".14"/>
  <rect x="430" y="276" width="740" height="348" rx="6" fill="#090909"/>
</svg>
