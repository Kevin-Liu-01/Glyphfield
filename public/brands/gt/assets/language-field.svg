<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Language lens</title>
  <desc id="description">A soft monochrome lens bends a fine dither field toward one center.</desc>
  <defs>
    <radialGradient id="light"><stop stop-color="#fff" stop-opacity=".92"/><stop offset=".26" stop-color="#fff" stop-opacity=".2"/><stop offset=".72" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".28"/></pattern>
    <mask id="lens"><ellipse cx="820" cy="450" rx="650" ry="390" fill="url(#light)"/></mask>
  </defs>
  <rect width="1600" height="900" fill="#050606"/>
  <ellipse cx="820" cy="450" rx="650" ry="390" fill="url(#light)"/>
  <rect width="1600" height="900" fill="url(#dots)" mask="url(#lens)"/>
  <ellipse cx="820" cy="450" rx="276" ry="276" fill="none" stroke="#fff" opacity=".16"/>
  <ellipse cx="820" cy="450" rx="190" ry="190" fill="none" stroke="#fff" opacity=".3"/>
</svg>
