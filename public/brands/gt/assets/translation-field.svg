<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Translation wave</title>
  <desc id="description">A pair of mirrored monochrome waves resolves into a bright center.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#050606"/>
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M-80 420C260 160 520 170 800 500c280 330 540 340 880 80" stroke-width="118" opacity=".17" filter="url(#blur)"/>
    <path d="M-80 580c340 260 600 250 880-80 280-330 540-340 880-80" stroke-width="118" opacity=".17" filter="url(#blur)"/>
    <path d="M-80 420C260 160 520 170 800 500c280 330 540 340 880 80" stroke-width="2" opacity=".7"/>
    <path d="M-80 580c340 260 600 250 880-80 280-330 540-340 880-80" stroke-width="2" opacity=".7"/>
  </g>
  <circle cx="800" cy="500" r="10" fill="#fff"/>
</svg>
